services:
  mysql:
    image: mysql:8.4
    container_name: ledgerline-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ledgerline_db
      MYSQL_USER: ledgerline_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3306:3306"
    volumes:
      - ledgerline_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: ledgerline-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/ledgerline_db
      DB_USERNAME: ledgerline_user
      DB_PASSWORD: ${DB_PASSWORD}
      LEDGERLINE_ADMIN_USERNAME: ${LEDGERLINE_ADMIN_USERNAME:-}
      LEDGERLINE_ADMIN_EMAIL: ${LEDGERLINE_ADMIN_EMAIL:-}
      LEDGERLINE_ADMIN_PASSWORD: ${LEDGERLINE_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  ledgerline_mysql_data:
